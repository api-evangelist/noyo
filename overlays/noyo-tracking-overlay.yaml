overlay: 1.0.0
info:
  title: API Evangelist enhancements for Noyo Tracking API
  version: 1.0.0
extends: openapi/noyo-tracking-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: noyo
    x-apievangelist-auth: oauth2-client-credentials-bearer
