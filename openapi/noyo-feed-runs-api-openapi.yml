openapi: 3.0.1
info:
  description: APIs to manage and consume information about Carriers
  title: Noyo Carrier Carrier Mapped Field Feed Runs API
  version: 1.0.0
servers: []
tags:
- name: Feed Runs
paths:
  /api/v1/feed/runs/{id}/file:
    x-summary: Get Feed Run File
    get:
      description: Returns a signed URL to the feed run file based on the ID provided
      operationId: getFeedRunFile
      parameters:
      - description: Unique identifier of the workflow
        in: path
        name: id
        required: true
        schema:
          example: 95ce77a6-30fd-4bd9-af10-8d3a1744ac2e
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                signed_url: https://storage.googleapis.com/noyo-feeds-production/454b979e-da31-4712-97e0-6f666bdb01c6/748f6710-d3be-4073-831c-315e1e34a2e0.txt?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=url-signer%40noyo-production.iam.gserviceaccount.com%2F20240923%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20240923T153921Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-
              schema:
                $ref: '#/components/schemas/PublicFeedRunFileResult'
          description: Successful Response - Returns a signed URL to the feed run file
      summary: Get a feed run file
      tags:
      - Feed Runs
components:
  schemas:
    PublicFeedRunFileResult:
      properties:
        signed_url:
          format: url
          type: string
      required:
      - signed_url
      type: object
      x-field_order: []
