components:
  schemas:
    MemberSnapshotDB:
      properties:
        coverages:
          description: List of coverage and enrollment decisions for each member
          items:
            $ref: '#/components/schemas/InboundMemberSnapshotCoverage'
          type: array
        dependents:
          description: List of demographic information for each dependent
          items:
            $ref: '#/components/schemas/InboundMemberSnapshotDependent'
          type: array
        employee:
          allOf:
          - $ref: '#/components/schemas/InboundMemberSnapshotEmployee'
          description: Demographic information for the employee
        enable_member_auto_link:
          default: false
          description: Boolean flag for autolinking workflow
          type: boolean
        events:
          description: List of events associated with member and coverage updates
          items:
            $ref: '#/components/schemas/InboundMemberSnapshotEvent'
          type: array
        omitted_coverage_handling:
          allOf:
          - $ref: '#/components/schemas/InboundMemberSnapshotOmittedCoverage'
          description: Configuration for handling omitted coverages
        snapshot_mode:
          description: Mode describing how the contents of the snapshot will be processed
          enum:
          - current_open
          example: current_open
          type: string
      required:
      - employee
      - snapshot_mode
      type: object
    LatestPlatformChange:
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/LatestChangeError'
          description: The error message explaining any issues from the platform change
        id:
          description: Unique identifier of the platform change record
          format: uuid
          type: string
        status:
          description: The status of the platform change
          type: string
        type:
          description: The type of the platform change record
          enum:
          - member_request
          - member_snapshot
          type: string
      required:
      - id
      - status
      - type
      type: object
    EmployeeCarrierStatus:
      properties:
        carrier_id:
          description: Unique identifier of the carrier in Noyo
          format: uuid
          type: string
        latest_platform_change:
          allOf:
          - $ref: '#/components/schemas/LatestPlatformChange'
          description: Details on the latest change sent to Noyo to be applied at the carrier
        pending_changes:
          description: A list of any open changes being processed with the carrier
          items:
            $ref: '#/components/schemas/PlatformChange'
          type: array
        status:
          description: The member status related to the latest requested platform changes
          enum:
          - pending_changes
          - stable
          - unable_to_fulfill
          type: string
      required:
      - pending_changes
      - status
      type: object
