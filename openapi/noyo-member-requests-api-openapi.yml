components:
  schemas:
    GroupHealthFundPlanResultWithConfig:
      properties:
        cobra_rules:
          allOf:
          - $ref: '#/components/schemas/GroupPlanCOBRARules'
          description: COBRA rules for the group health fund plan
        code:
          description: Plan code of the group health fund plan
          example: HSA
          type: string
        created:
          description: The date the record was created
          type: integer
        dependent_child_age_limits:
          description: List of all dependent child age limits configured for the group health fund plan
          items:
            $ref: '#/components/schemas/GroupPlanDependentChildAgeLimit'
          type: array
        effective_end_date:
          description: ISO-8601 date string for the effective end date of the record
          example: '2018-12-31'
          format: date
          nullable: true
          type: string
        effective_start_date:
          description: ISO-8601 date string for the effective start date of the record
          example: '2018-01-01'
          format: date
          nullable: true
          type: string
        eligible_member_types:
          description: List of member types eligible for the group health fund plan
          items:
            description: Member type eligible for the group health fund plan
            enum:
            - all
            - employee
            - child
            - spouse
            - domestic-partner
            - employee-with-dependents
            type: string
          minItems: 1
          type: array
        group_enrollment_id:
          description: Unique identifier of the associated group enrollment in the Noyo system
          format: uuid
          type: string
        id:
          description: Unique identifier of the record in Noyo
          format: uuid
          type: string
        modified:
          description: The date the record was last updated
          type: integer
        name:
          description: Name of the group health fund plan
          example: Health Fund - HSA
          type: string
        plan_configuration:
          description: Group Health Fund Plan configuration details
          type: object
        plan_type:
          description: Type of group health fund plan
          enum:
          - hsa
          - fsa
          - dca
          - lpfsa
          - hra
          type: string
        status:
          description: Status of the group health fund plan
          enum:
          - pending
          - active
          - discontinued
          type: string
        termination_policy:
          description: Termination policy for the group health fund plan
          enum:
