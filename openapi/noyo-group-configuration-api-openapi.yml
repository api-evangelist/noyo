components:
  schemas:
    CreatePersonRequest:
      properties:
        contact:
          allOf:
          - $ref: '#/components/schemas/PersonContact'
          description: Contact information for the person
        date_of_birth:
          description: ISO-8601 date string for the date of birth of the person
          example: '1977-06-03'
          format: date
          type: string
        details:
          allOf:
          - $ref: '#/components/schemas/PersonDetails'
          description: Additional personal details of the person
        first_name:
          description: First name of the person
          example: Catherine
          type: string
        home_address:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Home address of the person
        last_name:
          description: Last name of the person
          example: Briggs
          type: string
        maiden_name:
          description: Maiden name of the person (deprecated)
          type: string
        mailing_address:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Mailing address of the person, if different from home address
        marital_status:
          description: Marital status of the person
          enum:
          - single
          - married
          - domestic-partner
          - divorced
          - widowed
          - legally-separated
          example: married
          type: string
        middle_name:
          description: Middle name of the person
          example: S
          type: string
        sex:
          description: Sex of the person
          enum:
          - F
          - M
          - U
          - X
          example: F
          type: string
        ssn:
          description: Social Security Number of the person
          example: '123456789'
          nullable: true
          pattern: ^(?!000)[0-9]{3}(?!00)[0-9]{2}(?!0000)[0-9]{4}$
          type: string
        suffix:
          description: Suffix of the person
          type: string
      required:
      - date_of_birth
      - first_name
      - home_address
      - last_name
      - sex
      type: object
      x-field_order:
      - first_name
      - middle_name
      - last_name
      - suffix
      - home_address
      - mailing_address
      - date_of_birth
      - ssn
      - sex
      - marital_status
      - maiden_name
      - contact
      - details
