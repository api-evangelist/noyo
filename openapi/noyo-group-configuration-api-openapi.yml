        in: query
        name: date_of_birth
        required: false
        schema:
          type: string
      - description: Status of the employees employment
        in: query
        name: employment_status
        required: false
        schema:
          type: string
      - description: Filter employees by Person ID
        in: query
        name: person_id
        required: false
        schema:
          type: string
