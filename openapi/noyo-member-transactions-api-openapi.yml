        in: path
        name: transaction_id
        required: true
        schema:
          example: a6e30204-87b2-4802-95a4-a156bd0f7435
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                body:
                  coverages:
                  - carrier_config:
                      bill_group: '1000001'
