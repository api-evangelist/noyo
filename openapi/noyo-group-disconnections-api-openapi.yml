components:
  schemas:
    GroupDisconnectionRequestPublicConfirmRequest:
      properties:
        effective_end_date:
          description: The date at which the disconnection will take effect - required if not already set
          format: date
          type: string
      type: object
      x-field_order: []
    UIGroupDisconnectionRequestNestedReason:
      properties:
        context_from_carrier:
          description: Context provided by the carrier
          readOnly: true
          type: string
        context_from_platform:
          description: Context given by a platform when rejecting a disconnection
          readOnly: true
          type: string
        created_by:
          description: Which team created the reason
          readOnly: true
          type: string
        other_reason:
          description: Other reason for the request
          readOnly: true
          type: string
        reason:
          description: Why the action was taken
          readOnly: true
          type: string
      required:
      - created_by
      type: object
      x-field_order:
      - created_by
      - reason
      - other_reason
      - context_from_carrier
      - context_from_platform
    GroupDisconnectionRequestPublicCreateRequest:
      properties:
        carrier_id:
          description: Unique identifier for the carrier to be disconnected from.
          format: uuid
          type: string
        context:
          description: Context on why the request was created
          type: string
        effective_end_date:
          description: The date at which the disconnection will take effect.
          format: date
          type: string
        group_id:
          description: Unique identifier for the group to be disconnected.
          format: uuid
          type: string
        reason:
          description: The reason for the GDR creation
          enum:
          - broker_of_record
          - changed_enrollment_method
          - lost_group
          - no_longer_eligible
          - not_using_connection
          - other
          - terminated
          type: string
      required:
      - carrier_id
      - effective_end_date
      - group_id
      type: object
      x-field_order:
      - carrier_id
      - group_id
      - effective_end_date
    UIPaginatedGroupDisconnectionRequestResult:
      properties:
        meta:
          allOf:
          - $ref: '#/components/schemas/Meta'
          description: Metadata associated with the response data
        response:
          description: List of group disconnection request results
          items:
            $ref: '#/components/schemas/UIGroupDisconnectionRequestResult'
          type: array
      required:
      - meta
      - response
      type: object
      x-field_order:
      - meta
      - response
    GroupDisconnectionRequestPublicEditRequest:
      properties:
        context:
          description: Context on why the request was rejected
          type: string
        effective_end_date:
          description: The date at which the disconnection will take effect - required if not already set
          format: date
          type: string
        reason:
          description: The reason for the GDR status change/creation
          enum:
          - connection_restored
          - eligibility_restored
          - other
          - payment_reinstated
          type: string
        status:
          description: The status of the disconnection request
          enum:
          - processing
          - rejected
          type: string
      required:
      - status
      type: object
      x-field_order: []
    PaginatedGroupDisconnectionRequestResult:
      properties:
        meta:
          allOf:
          - $ref: '#/components/schemas/Meta'
          description: Metadata associated with the response data
        response:
          description: List of group disconnection request results
          items:
            $ref: '#/components/schemas/GroupDisconnectionRequestResult'
          type: array
      required:
      - meta
      - response
      type: object
      x-field_order:
      - meta
      - response
    Meta:
      properties:
        offset:
          description: The offset of the first response record within the matching data set
          format: int32
          minimum: 0
          readOnly: true
          type: integer
        page_num:
          description: The page number of the response records within the overall data set (1-based integer)
          format: int32
          minimum: 1
          readOnly: true
          type: integer
        page_size:
          description: The maximum number of response records on each page of results
          format: int32
          minimum: 1
          readOnly: true
          type: integer
        total_records:
          description: The total number of records in the entire matching data set
          format: int32
          minimum: 0
          readOnly: true
          type: integer
      required:
      - offset
      - page_num
      - page_size
      type: object
    UIGroupDisconnectionRequestResult:
      properties:
        carrier_id:
          description: Unique identifier for the carrier to be disconnected from
          format: uuid
          readOnly: true
          type: string
        completed:
          description: Timestamp at which the disconnection was completed
          readOnly: true
          type: integer
        created:
          description: The date the record was created
          type: integer
        created_reason:
          $ref: '#/components/schemas/UIGroupDisconnectionRequestNestedReason'
        decided:
          description: Timestamp at which the platform recorded a decision on the disconnection
          readOnly: true
          type: integer
        effective_end_date:
          description: The date at which the disconnection will take effect
          format: date
          readOnly: true
          type: string
        group_id:
          description: Unique identifier for the group to be disconnected. May be missing if group has already been disconnected.
          format: uuid
          readOnly: true
          type: string
        group_name:
          description: Name of the group to be disconnected from
          readOnly: true
          type: string
        id:
          description: Unique identifier of the record in Noyo
          format: uuid
          type: string
        modified:
          description: The date the record was last updated
          type: integer
        organization_id:
          description: Unique identifier for organization associated with the request
          format: uuid
          readOnly: true
