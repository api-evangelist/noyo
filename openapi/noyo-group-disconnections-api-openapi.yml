openapi: 3.0.1
info:
  description: APIs to manage and consume information about Carriers
  title: Noyo Carrier Carrier Mapped Field Group Disconnections API
  version: 1.0.0
servers: []
tags:
- name: Group Disconnections
paths:
  /api/v1/group_disconnection_requests:
    get:
      description: Returns a list of all group Disconnection requests.
      operationId: getGroupDisconnectionRequestList
      parameters:
      - description: The max size of each page of results
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: The integer offset at which to start the page. Possible values are 0 to total_records - 1
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Status of the group Disconnection requests for which you would like to filter.
        in: query
        name: status
        schema:
          example: created
          type: string
      - description: Comma-separated list of carrier UUID's for which you would like to view group disconnection requests
        in: query
        name: carrier_id
        required: false
        schema:
          example: 2613a221-d3c8-4c8a-86d5-e7e885fd1da9
          format: uuid
          type: string
      - in: query
        name: group_id
        schema:
          type: string
      - in: query
        name: min_effective_end_date
        schema:
          type: string
      - in: query
        name: max_effective_end_date
        schema:
          type: string
      - description: Search by group name
        in: query
        name: search
        required: false
        schema:
          example: Widgets R Us
          type: string
      - description: Source type to filter by
        in: query
        name: source_type
        required: false
        schema:
          example: platform
          type: string
      - description: Comma-separated list of requested Group Disconnection Request UUIDs
        in: query
        name: id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                meta:
                  offset: 0
                  page_num: 1
                  page_size: 20
                  total_records: 1
                response:
                - carrier_id: 5200a894-81c5-4c41-8519-86c32e9a9965
                  completed: null
                  created: 1557329939
                  decided: 1557329939
                  effective_end_date: '2025-01-01'
                  group_id: f833ac4b-36aa-46f4-826c-0badcfe27922
                  group_name: Widgets R Us
                  id: dd9a1813-34f7-4c7e-86bc-f041f2cbd9a1
                  modified: 1557329939
                  organization_id: ca72d1e1-56a6-46ac-b400-a91e1f6b893a
                  source_id: null
                  source_type: platform
                  status: processing
                  version: 5200a894-81c5-4c41-8519-86c32e9a9965
              schema:
                $ref: '#/components/schemas/PaginatedGroupDisconnectionRequestResult'
          description: Successful Response - Returns all matching Group Disconnection Requests
      summary: List Group Disconnection Requests
      tags:
      - Group Disconnections
    post:
      description: Create a new Group Disconnection Request
      operationId: createNewGroupDisconnectionRequest
      requestBody:
        content:
          application/json:
            examples:
              success:
                value:
                  carrier_id: 5200a894-81c5-4c41-8519-86c32e9a9965
                  effective_end_date: '2025-01-01'
                  group_id: f833ac4b-36aa-46f4-826c-0badcfe27922
            schema:
              $ref: '#/components/schemas/GroupDisconnectionRequestPublicCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                carrier_id: 5200a894-81c5-4c41-8519-86c32e9a9965
                completed: null
                created: 1557329939
                decided: 1557329939
                effective_end_date: '2025-01-01'
                group_id: f833ac4b-36aa-46f4-826c-0badcfe27922
                group_name: Besta LLC
                id: dd9a1813-34f7-4c7e-86bc-f041f2cbd9a1
                modified: 1557329939
                organization_id: ca72d1e1-56a6-46ac-b400-a91e1f6b893a
                source_id: null
                source_type: platform
                status: processing
                version: 5200a894-81c5-4c41-8519-86c32e9a9965
              schema:
                $ref: '#/components/schemas/GroupDisconnectionRequestResult'
          description: Successful Response - Returns the new GroupDisconnectionRequest
        '403':
          content:
            application/json:
              example:
                message: Protected group disconnection is forbidden without an internal override.
          description: Protected group disconnection is forbidden
      summary: Create a new Group Disconnection Request
      tags:
      - Group Disconnections
  /api/v1/group_disconnection_requests/{group_disconnection_request_id}:
    x-summary: Get Group disconnection Request by request Id
