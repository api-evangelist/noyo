aid: noyo
name: Noyo
description: >-
  Noyo operates benefits data infrastructure that automates the exchange of
  employee benefits enrollment data between benefits administration platforms,
  brokers, and insurance carriers. Its APIs let ben-admin platforms connect a
  group to a carrier, send member snapshots (new hires, qualifying life events,
  open enrollment, COBRA, terminations), and receive near-real-time, field-level
  tracking of every change through to carrier confirmation. The Fulfillment API
  manages groups, connections, employees, dependents, enrollments, plans,
  renewals and member requests; the Tracking API surfaces differences and
  discrepancies; the Carrier API exposes carrier network configuration. Noyo
  standardizes the messy, EDI-heavy world of carrier data exchange behind a
  modern REST interface with webhooks and a sandbox.
